[package]
name = "meijer-rs"
version = "0.1.0"
edition = "2021"
authors = ["Meijer CLI Team"]
description = "Rust implementation of Meijer CLI tool"
license = "MIT"

[[bin]]
name = "meijer-rs"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# URL handling
url = "2.4"

# Pickle support for Python compatibility
# pickle = "0.1"  # Not available

# Table formatting (equivalent to rich in Python)
tabled = "0.14"

# Configuration
config = "0.14"
dirs = "5.0"

# Async runtime (for future expansion)
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
