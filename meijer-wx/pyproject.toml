[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meijer-wx"
version = "1.0.0"
description = "wxPython GUI for python_Meijer v2"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cursor.sh | Claude", email = "claude@cursor.sh"}
]
maintainers = [
    {name = "Cursor.sh | Claude", email = "claude@cursor.sh"}
]
keywords = ["meijer", "shopping", "gui", "wxpython", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Desktop Environment",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11"
dependencies = [
    "wxPython>=4.2.0",
    "platformdirs>=4.0.0",
    "PyYAML>=6.0.1",
    "toml>=0.10.2",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "colorlog>=6.7.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "pre-commit>=3.5.0",
    "pyinstaller>=6.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/dapperfu/python_Meijer"
Documentation = "https://github.com/dapperfu/python_Meijer/wiki"
Repository = "https://github.com/dapperfu/python_Meijer.git"
Issues = "https://github.com/dapperfu/python_Meijer/issues"

[project.scripts]
meijer-wx = "meijer_wx.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meijer_wx*"]
exclude = ["tests*", "build*", "dist*", "venv*"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gui: marks tests as GUI tests",
]

[tool.coverage.run]
source = ["meijer_wx"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
